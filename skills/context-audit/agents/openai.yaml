interface:
  display_name: "Context Audit"
  short_description: "Audit a project's instruction and context architecture — analysis-only, the user applies the proposed changes"
  default_prompt: "Use $context-audit to audit this repository's instruction and context architecture (CLAUDE.md, AGENTS.md, skills, nested files, hooks). Analysis-only; preserve each rule's effective reach across the target harnesses."
policy:
  allow_implicit_invocation: false
