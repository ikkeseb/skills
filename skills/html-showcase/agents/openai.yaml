interface:
  display_name: html-showcase
  short_description: >-
    Art-direct a single-file HTML page that has to impress, designing a
    fresh visual concept from the content each time: a launch, a showcase,
    an announcement, a landing page. Not for documents made to be read
    (plans, status, findings, run sheets), decks, or web-app frontends.
policy:
  allow_implicit_invocation: false
