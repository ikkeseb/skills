interface:
  display_name: html-showcase
  short_description: >-
    Art-direct one self-contained HTML file that has to impress, with a
    fresh visual concept from its content: a launch, showcase, announcement
    or one-off landing page. Not for pages inside a site's codebase,
    documents made to be read, decks, or web-app frontends.
policy:
  allow_implicit_invocation: false
