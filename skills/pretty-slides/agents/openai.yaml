interface:
  display_name: pretty-slides
  short_description: >-
    Build a presentation as one self-contained HTML file: bundled slide
    engine, inlined fonts and images, re-skinnable through a token block,
    screenshot QA of every slide before done. For talks and decks that
    stand in for PowerPoint. Not for documents, PDFs, or web-app frontends.
policy:
  allow_implicit_invocation: false
